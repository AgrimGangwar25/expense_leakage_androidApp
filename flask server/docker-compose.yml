services:
  db:
    image: postgres:15-alpine
    container_name: expense_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: agrim2510
      POSTGRES_DB: expense_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: expense_flask_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=expense_db
      - DB_USER=postgres
      - DB_PASS=agrim2510
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
